<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparador FOB PY — Top Neumáticos</title>
<style>
  :root{
    --bg:#0f1512;
    --panel:#161f1a;
    --panel-2:#1c2620;
    --line:#2a3630;
    --ink:#eef2ee;
    --ink-dim:#9fb0a6;
    --accent:#4fae7a;
    --accent-dim:#2f6b49;
    --warn:#d97a4a;
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .wrap{width:100%;max-width:1100px;}
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:8px;
  }
  h1{
    font-size:19px;
    font-weight:600;
    letter-spacing:0.2px;
    margin:0;
  }
  h1 span{color:var(--ink-dim);font-weight:400;}
  .status{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-dim);
  }
  .status.ok{color:var(--accent);}
  .status.err{color:var(--warn);}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
    margin-bottom:24px;
  }
  .row{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
  }
  label.field-label{
    font-size:12px;
    color:var(--ink-dim);
    display:block;
    margin-bottom:6px;
  }
  input[type="password"], input[type="text"]{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink);
    padding:10px 12px;
    border-radius:6px;
    font-family:var(--mono);
    font-size:13px;
    min-width:240px;
    outline:none;
  }
  input[type="password"]:focus, input[type="text"]:focus{
    border-color:var(--accent-dim);
  }
  .checkbox-row{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--ink-dim);
  }
  button{
    background:var(--accent);
    color:#0b140d;
    border:none;
    font-weight:600;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    transition:opacity .15s ease;
  }
  button:hover{opacity:.9;}
  button:disabled{
    opacity:.5;
    cursor:not-allowed;
  }
  .error-box{
    display:none;
    margin-top:14px;
    padding:12px 14px;
    background:#2a1610;
    border:1px solid #5a2c1a;
    color:#f0b39a;
    border-radius:6px;
    font-family:var(--mono);
    font-size:12.5px;
    white-space:pre-wrap;
  }
  .result-frame-wrap{
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    background:#fff;
    min-height:60vh;
    display:flex;
  }
  iframe{
    width:100%;
    min-height:75vh;
    border:none;
    flex:1;
  }
  .placeholder{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-dim);
    font-size:13px;
    padding:60px 20px;
    background:var(--panel);
  }
  footer{
    margin-top:24px;
    font-size:11px;
    color:var(--ink-dim);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Comparador FOB PY <span>· Top Neumáticos</span></h1>
    <div class="status" id="status">Sin generar</div>
  </header>

  <div class="panel">
    <div class="row">
      <div>
        <label class="field-label" for="authKey">Clave de acceso</label>
        <input type="password" id="authKey" placeholder="Ingresá la clave" autocomplete="off">
      </div>
      <div>
        <label class="field-label">&nbsp;</label>
        <button id="generateBtn">Generar comparador</button>
      </div>
    </div>
    <div class="checkbox-row" style="margin-top:12px;">
      <input type="checkbox" id="rememberKey">
      <label for="rememberKey">Recordar clave en este navegador</label>
    </div>
    <div class="error-box" id="errorBox"></div>
  </div>

  <div class="result-frame-wrap" id="resultWrap">
    <div class="placeholder" id="placeholder">El comparador va a aparecer acá una vez generado.</div>
  </div>

  <footer>Última generación: <span id="lastGen">—</span></footer>
</div>

<script>
  // Ajustar según el entorno: local con ngrok mientras se prueba, o el dominio
  // definitivo cuando el workflow quede activo en producción.
  const WEBHOOK_URL = "https://envy-recollect-last.ngrok-free.dev/webhook/FOB-PY";
  const AUTH_HEADER_NAME = "X-Auth-Key";
  const STORAGE_KEY = "fobpy_auth_key";

  const authInput = document.getElementById("authKey");
  const rememberCheckbox = document.getElementById("rememberKey");
  const generateBtn = document.getElementById("generateBtn");
  const statusEl = document.getElementById("status");
  const errorBox = document.getElementById("errorBox");
  const resultWrap = document.getElementById("resultWrap");
  const placeholder = document.getElementById("placeholder");
  const lastGenEl = document.getElementById("lastGen");

  // Restaurar clave guardada, si el usuario optó por recordarla
  const savedKey = localStorage.getItem(STORAGE_KEY);
  if (savedKey) {
    authInput.value = savedKey;
    rememberCheckbox.checked = true;
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = "status" + (cls ? " " + cls : "");
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
  }

  function hideError() {
    errorBox.style.display = "none";
    errorBox.textContent = "";
  }

  async function generarComparador() {
    const key = authInput.value.trim();
    hideError();

    if (!key) {
      showError("Ingresá la clave de acceso antes de continuar.");
      return;
    }

    if (rememberCheckbox.checked) {
      localStorage.setItem(STORAGE_KEY, key);
    } else {
      localStorage.removeItem(STORAGE_KEY);
    }

    generateBtn.disabled = true;
    setStatus("Generando…");

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: "GET",
        headers: {
          [AUTH_HEADER_NAME]: key
        }
      });

      if (response.status === 401 || response.status === 403) {
        throw new Error("Avisar al Área de Mejora Continua.");
      }
      if (!response.ok) {
        throw new Error("El workflow respondió con error HTTP " + response.status + ".");
      }

      const html = await response.text();

      // Renderizar el HTML devuelto dentro de un iframe aislado
      placeholder.remove();
      let iframe = document.getElementById("resultFrame");
      if (!iframe) {
        iframe = document.createElement("iframe");
        iframe.id = "resultFrame";
        resultWrap.appendChild(iframe);
      }
      iframe.srcdoc = html;

      setStatus("Generado correctamente", "ok");
      lastGenEl.textContent = new Date().toLocaleString("es-AR");
    } catch (err) {
      setStatus("Error al generar", "err");
      showError("Avisar al Área de Mejora Continua.");
    } finally {
      generateBtn.disabled = false;
    }
  }

  generateBtn.addEventListener("click", generarComparador);
  authInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") generarComparador();
  });
</script>
</body>
</html>
