<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparador FOB PY — Top Neumáticos</title>
<style>
  :root{
    --bg:#0f1512;
    --panel:#161f1a;
    --panel-2:#1c2620;
    --line:#2a3630;
    --ink:#eef2ee;
    --ink-dim:#9fb0a6;
    --accent:#4fae7a;
    --accent-dim:#2f6b49;
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .wrap{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:32px 28px;
    text-align:center;
  }
  h1{
    font-size:18px;
    font-weight:600;
    margin:0 0 4px;
  }
  h1 span{color:var(--ink-dim);font-weight:400;}
  .subtitle{
    font-size:12.5px;
    color:var(--ink-dim);
    margin:0 0 24px;
  }
  .field{
    text-align:left;
    margin-bottom:14px;
  }
  label.field-label{
    font-size:12px;
    color:var(--ink-dim);
    display:block;
    margin-bottom:6px;
  }
  input[type="password"]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink);
    padding:11px 12px;
    border-radius:6px;
    font-family:var(--mono);
    font-size:13px;
    outline:none;
  }
  input[type="password"]:focus{
    border-color:var(--accent-dim);
  }
  .checkbox-row{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--ink-dim);
    margin-bottom:22px;
    text-align:left;
  }
  button{
    width:100%;
    background:var(--accent);
    color:#0b140d;
    border:none;
    font-weight:600;
    padding:13px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    transition:opacity .15s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  button:hover{opacity:.9;}
  button:disabled{
    opacity:.7;
    cursor:not-allowed;
  }
  .spinner{
    width:15px;
    height:15px;
    border:2px solid rgba(11,20,13,0.3);
    border-top-color:#0b140d;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    display:none;
  }
  button.loading .spinner{display:inline-block;}
  @keyframes spin{
    to{transform:rotate(360deg);}
  }
  .timer{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-dim);
    margin-top:14px;
    min-height:16px;
  }
  .error-box{
    display:none;
    margin-top:16px;
    padding:12px 14px;
    background:#2a1610;
    border:1px solid #5a2c1a;
    color:#f0b39a;
    border-radius:6px;
    font-size:13px;
    text-align:left;
  }
  .link-fallback{
    margin-top:14px;
  }
  .link-fallback a{
    display:none;
    color:var(--accent);
    font-size:13px;
    text-decoration:underline;
  }
  footer{
    margin-top:20px;
    font-size:11px;
    color:var(--ink-dim);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Comparador FOB PY <span>· Top Neumáticos</span></h1>
  <p class="subtitle">Genera el comparador con los precios y datos más recientes.</p>

  <div class="field">
    <label class="field-label" for="authKey">Clave de acceso</label>
    <input type="password" id="authKey" placeholder="Ingresá la clave" autocomplete="off">
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="rememberKey">
    <label for="rememberKey">Recordar clave en este navegador</label>
  </div>

  <button id="generateBtn">
    <span class="spinner"></span>
    <span class="btn-label" id="btnLabel">Generar comparador</span>
  </button>

  <div class="timer" id="timer"></div>
  <div class="error-box" id="errorBox">Avisar al Área de Mejora Continua.</div>
  <div class="link-fallback" id="linkFallback"></div>

  <footer>TOP Neumáticos · Área de Mejora Continua</footer>
</div>

<script>
  const WEBHOOK_URL = "https://envy-recollect-last.ngrok-free.dev/webhook/FOB-PY";
  const AUTH_HEADER_NAME = "X-Auth-Key";
  const STORAGE_KEY = "fobpy_auth_key";

  const authInput = document.getElementById("authKey");
  const rememberCheckbox = document.getElementById("rememberKey");
  const generateBtn = document.getElementById("generateBtn");
  const btnLabel = document.getElementById("btnLabel");
  const timerEl = document.getElementById("timer");
  const errorBox = document.getElementById("errorBox");

  const savedKey = localStorage.getItem(STORAGE_KEY);
  if (savedKey) {
    authInput.value = savedKey;
    rememberCheckbox.checked = true;
  }

  let timerInterval = null;
  let startTime = null;

  function formatTime(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
    const seconds = String(totalSeconds % 60).padStart(2, "0");
    return minutes + ":" + seconds;
  }

  function startTimer() {
    startTime = Date.now();
    timerEl.textContent = "00:00";
    timerInterval = setInterval(() => {
      timerEl.textContent = formatTime(Date.now() - startTime);
    }, 250);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  async function generarComparador() {
    const key = authInput.value.trim();
    errorBox.style.display = "none";
    document.getElementById("linkFallback").innerHTML = "";

    if (!key) {
      errorBox.style.display = "block";
      return;
    }

    if (rememberCheckbox.checked) {
      localStorage.setItem(STORAGE_KEY, key);
    } else {
      localStorage.removeItem(STORAGE_KEY);
    }

    generateBtn.disabled = true;
    generateBtn.classList.add("loading");
    btnLabel.textContent = "Generando…";
    startTimer();

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: {
          [AUTH_HEADER_NAME]: key,
          "ngrok-skip-browser-warning": "true"
        }
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const html = await response.text();
      const blob = new Blob([html], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const nuevaVentana = window.open(url, "_blank");

      if (!nuevaVentana || nuevaVentana.closed) {
        const fallback = document.getElementById("linkFallback");
        fallback.innerHTML = '<a href="' + url + '" target="_blank" rel="noopener">El navegador bloqueó la ventana — abrir el comparador acá</a>';
        fallback.querySelector("a").style.display = "inline-block";
      }
    } catch (err) {
      errorBox.style.display = "block";
    } finally {
      stopTimer();
      generateBtn.disabled = false;
      generateBtn.classList.remove("loading");
      btnLabel.textContent = "Generar comparador";
      timerEl.textContent = "";
    }
  }

  generateBtn.addEventListener("click", generarComparador);
  authInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") generarComparador();
  });
</script>
</body>
</html>
